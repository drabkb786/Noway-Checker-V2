name: NOWAY CDN Finder R5 Android CI

on:
  push:
    branches: [ main, cdn-finder-r5 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build installable release APK
        run: gradle --no-daemon assembleRelease

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOWAY-CDN-Finder-R5
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
